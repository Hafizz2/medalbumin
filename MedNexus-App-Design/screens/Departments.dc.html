<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study — departments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 58px 20px 110px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em">Study</h1>
        <span style="font-size: 13px; color: #56657D">6 departments · 5,340 questions</span>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="PastPapers.dc.html" aria-label="Past papers by year" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg></a>
        <a href="Search.dc.html" aria-label="Search" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a>
      </div>
    </div>
    <div role="tablist" aria-label="Filter" style="display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 9px">
      <sc-for list="{{depts}}" as="d" hint-placeholder-count="6">
        <a href="Department.dc.html" style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 20px; padding: 12px 14px; text-decoration: none; color: #062A5E; display: flex; align-items: center; gap: 13px; min-height: 74px; box-sizing: border-box">
          <span style="width: 48px; height: 48px; border-radius: 15px; background: {{d.bg}}; color: {{d.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <span style="font-weight: 600; font-size: 15px">{{d.name}}</span>
            <span style="display: flex; justify-content: space-between; font-size: 12px; color: #56657D"><span>{{d.topics}}</span><span style="font-family: 'Geist Mono', monospace; color: {{d.pctInk}}">{{d.pct}}</span></span>
            <span style="height: 5px; border-radius: 99px; background: #EBEFF5; overflow: hidden"><span style="display: block; height: 100%; width: {{d.done}}; background: {{d.bar}}; border-radius: 99px"></span></span>
          </span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56657D" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 22px; height: 68px; border-radius: 24px; background: #062A5E; display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
    <a href="Home.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Departments.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; background: #12407F; color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>Study</a>
    <a href="Progress.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progress</a>
    <a href="Notes.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Notes</a>
    <a href="Profile.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all' }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const I = {
      steth: 'M6 3v5a5 5 0 0 0 10 0V3M4 3h4M14 3h4M11 13v2a5 5 0 0 0 10 0v-1M21 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      blade: 'M15 3l6 6-10 10H5v-6zM12 6l6 6M3 21l3-3',
      baby: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM9 12h.01M15 12h.01M9.5 15.5a3.5 3.5 0 0 0 5 0M12 5c0-1.5 1-2.5 2.5-2.5',
      female: 'M12 14a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 14v7M9 18h6',
      globe: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',
      eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'
    };
    const D = [
      ['Internal Medicine', 'steth', 56, 72, '#062A5E', '#FFFFFF'],
      ['Surgery', 'blade', 33, 48, '#DDF3F5', '#017F8E'],
      ['Pediatrics & Child Health', 'baby', 21, 42, '#E4ECFB', '#2550A8'],
      ['Obstetrics & Gynecology', 'female', 18, 36, '#F3E6F4', '#7A3B8E'],
      ['Public Health', 'globe', 6, 30, '#FFF3D6', '#7A5A12'],
      ['Minor clinicals', 'eye', 0, 24, '#E6EBF2', '#475569']
    ];
    const f = this.state.f;
    const depts = D.map(([name, ic, done, total, bg, ink]) => {
      const p = Math.round((done / total) * 100);
      return { name, icon: I[ic], bg, ink, topics: done + ' / ' + total + ' topics', pct: p + '%', done: p + '%', status: p === 0 ? 'new' : p === 100 ? 'done' : 'prog',
        pctInk: p === 0 ? '#56657D' : '#017F8E', bar: p < 30 ? '#14BCC4' : '#017F8E' };
    }).filter((d) => f === 'all' || d.status === f);
    const chips = [['all', 'All'], ['prog', 'In progress'], ['new', 'Not started'], ['done', 'Completed']].map(([id, label]) => {
      const on = id === f;
      return { label, on: on ? 'true' : 'false', pick: () => this.setState({ f: id }),
        style: 'height: 38px; padding: 0 14px; border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; ' + (on ? 'background: #062A5E; color: #FFFFFF; border: 1px solid #062A5E' : 'background: #FFFFFF; color: #062A5E; border: 1px solid #D8DFEA') };
    });
    return { accent, chips, depts };
  }
}
</script>
</body>
</html>
