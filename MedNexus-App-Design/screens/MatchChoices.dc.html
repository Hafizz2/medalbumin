<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match predictor — my choice list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="MatchPredictor.dc.html" aria-label="Back to chances" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <span style="font-size: 14px; font-weight: 600">My choice list</span>
      <button aria-label="Share as PDF" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#062A5E" stroke-width="2" stroke-linecap="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
    </div>

    <div style="background: #062A5E; color: #F3F6FA; border-radius: 22px; padding: 16px 18px; display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'Outfit', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.04em; color: {{accent}}">{{overall}}%</span>
      <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Chance you match on this list</span><span style="font-size: 12px; color: #A9BBD8">Score 77.7 · 2 specialties · up to 3 universities each</span></span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600">{{g.order}} · {{g.name}}</h2><span style="font-size: 12px; color: {{g.tipInk}}">{{g.tip}}</span></div>
        <div style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 18px; overflow: hidden">
          <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
            <div style="{{i.row}}">
              <span style="width: 28px; height: 28px; border-radius: 9px; background: #062A5E; color: #F3F6FA; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 13px; flex-shrink: 0">{{i.rank}}</span>
              <span style="flex: 1; font-size: 14px; font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.name}}</span>
              <span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: {{i.ink}}">{{i.p}}%</span>
              <button aria-label="Move up" onClick="{{i.up}}" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #D8DFEA; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: {{i.upOp}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#062A5E" stroke-width="2.4" stroke-linecap="round"><path d="m6 15 6-6 6 6"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <section style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 600">Matching timeline</span><button role="switch" aria-checked="{{remind}}" onClick="{{toggleRemind}}" style="height: 32px; padding: 0 10px; border-radius: 10px; border: 0; cursor: pointer; font-size: 12px; font-weight: 600; background: {{remindBg}}; color: {{remindInk}}">{{remindText}}</button></div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <span style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 99px; background: {{s.c}}"></span><span style="font-size: 10px; line-height: 1.25; color: {{s.ink}}; font-weight: {{s.w}}">{{s.t}}</span></span>
        </sc-for>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #F3F6FA; border-top: 1px solid #E0E6EE">
    <a href="Department.dc.html" style="height: 56px; border-radius: 16px; background: #062A5E; color: #F3F6FA; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px">Raise my score · practise weak topics</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { remind: true, lists: {
    im: [['Jimma University', 85], ['University of Gondar', 89], ['St. Paul’s Millennium MC', 42]],
    ped: [['Addis Ababa University', 61], ['Jimma University', 97], ['Hawassa University', 97]] } }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const L = this.state.lists;
    const move = (k, i) => () => { if (i === 0) return; const a = [...L[k]]; [a[i - 1], a[i]] = [a[i], a[i - 1]]; this.setState({ lists: { ...L, [k]: a } }); };
    const groups = [['im', '1st', 'Internal Medicine'], ['ped', '2nd', 'Pediatrics']].map(([k, order, name]) => {
      const items = L[k].map(([n, p], i) => ({ name: n, p, rank: i + 1, up: move(k, i), upOp: i === 0 ? '0.35' : '1',
        ink: p >= 70 ? '#017F8E' : p >= 35 ? '#7A5A12' : '#B4441A',
        row: 'display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; min-height: 52px; box-sizing: border-box; ' + (i > 0 ? 'border-top: 1px solid #EBEFF5' : '') }));
      const hasSafe = L[k].some(([, p]) => p >= 70);
      return { order, name, items, tip: hasSafe ? '✓ Has a safe option' : 'Add a safer option', tipInk: hasSafe ? '#017F8E' : '#B4441A' };
    });
    const all = [...L.im, ...L.ped].map(([, p]) => p / 100);
    const overall = Math.round((1 - all.reduce((acc, p) => acc * (1 - p), 1)) * 100);
    const T = ['Registration', 'Eligibility list', 'Entrance exam', 'Results & appeal', 'Match results'];
    const steps = T.map((t, i) => ({ t, c: i === 0 ? '#017F8E' : '#D8DFEA', ink: i === 0 ? '#017F8E' : '#56657D', w: i === 0 ? '600' : '500' }));
    const r = this.state.remind;
    return { accent, groups, overall: Math.min(overall, 99), steps,
      remind: r ? 'true' : 'false', toggleRemind: () => this.setState({ remind: !r }),
      remindText: r ? 'Reminders on' : 'Remind me', remindBg: r ? '#DDF3F5' : '#062A5E', remindInk: r ? '#017F8E' : '#F3F6FA' };
  }
}
</script>
</body>
</html>
