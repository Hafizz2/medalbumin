<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <button onClick="{{readAll}}" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #017F8E; font-size: 14px; font-weight: 600; cursor: pointer">Mark all read</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">Notifications</h1>
      <span style="font-size: 13px; color: #56657D">{{unread}} unread</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
        <a href="{{n.href}}" onClick="{{n.read}}" style="{{n.card}}">
          <span style="width: 40px; height: 40px; border-radius: 13px; background: {{n.bg}}; color: {{n.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 600">{{n.t}}</span><span style="font-size: 11px; color: #56657D; flex-shrink: 0">{{n.when}}</span></span>
            <span style="font-size: 13px; color: #475569; line-height: 1.4">{{n.m}}</span>
          </span>
          <span style="{{n.dot}}"></span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { read: { 4: true, 5: true, 6: true } }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const N = [
      ['Payment approved', 'Your Semester plan is active until 13 Apr 2027.', '5 min', 'Plans.dc.html', '#DDF3F5', '#017F8E', 'm5 12 5 5 9-10'],
      ['Grand Mock #12 in 4 days', 'Saturday 9:00 AM. You are registered.', '1 h', 'LiveMock.dc.html', '#F0E9FB', '#5A3399', 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l2.5 2'],
      ['Faculty answered your doubt', '“In left-dominant hearts the circumflex can…”', '2 h', 'Discussion.dc.html', '#062A5E', '#14BCC4', 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],
      ['Streak at risk', 'Answer 10 questions before midnight to keep your 12-day streak.', '3 h', 'Question.dc.html', '#FFE8D6', '#B4441A', 'M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5'],
      ['New: Exit Exam 2025 paper', '200 questions with explanations, now in Past papers.', 'Yesterday', 'PastPapers.dc.html', '#DDF3F5', '#017F8E', 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6'],
      ['Residency registration opens soon', 'Your match choice list is ready to review.', 'Mon', 'MatchChoices.dc.html', '#E4ECFB', '#2550A8', 'M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z'],
      ['You were invited by Dawit', 'You both get 1 free month when you subscribe.', 'Oct 9', 'Plans.dc.html', '#FFF3D6', '#7A5A12', 'M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z']
    ];
    const r = this.state.read;
    const items = N.map(([t, m, when, href, bg, ink, d], i) => {
      const unread = !r[i];
      return { t, m, when, href, bg, ink, d, read: () => this.setState({ read: { ...r, [i]: true } }),
        dot: unread ? 'width: 8px; height: 8px; border-radius: 50%; background: #E2622F; flex-shrink: 0; align-self: center' : 'width: 8px; flex-shrink: 0',
        card: 'display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 18px; text-decoration: none; color: #062A5E; ' + (unread ? 'background: #FFFFFF; border: 1px solid #D8DFEA' : 'background: transparent; border: 1px solid transparent') };
    });
    return { accent, items, unread: items.filter((_, i) => !r[i]).length,
      readAll: () => this.setState({ read: { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true, 6: true } }) };
  }
}
</script>
</body>
</html>
