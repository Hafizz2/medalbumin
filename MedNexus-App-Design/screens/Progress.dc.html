<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 56px 20px 110px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.02em">Your progress</h1>
      <a href="StudyPlan.dc.html" aria-label="Study calendar" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
    </div>
    <div role="tablist" aria-label="View" style="display: flex; gap: 6px; background: #E6EBF2; padding: 4px; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isOverview}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="background: #062A5E; color: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: flex-start">
            <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #A9BBD8">Overall performance</span><span style="font-family: 'Outfit', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">74%</span></div>
            <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: #12407F; color: {{accent}}">+16%</span><span style="font-size: 11px; color: #94A6C4">vs last month</span></span>
          </div>
          <svg role="img" aria-label="Performance rising from 58 to 74 percent over the month" width="326" height="70" viewBox="0 0 326 70">
            <polygon points="{{area}}" fill="{{accent}}" fill-opacity="0.18"></polygon>
            <polyline points="{{line}}" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
            <circle cx="{{lastX}}" cy="{{lastY}}" r="4.5" fill="#062A5E" stroke="{{accent}}" stroke-width="2.5"></circle>
          </svg>
          <div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; color: #94A6C4"><span>Sep 14</span><span>Sep 28</span><span>Oct 12</span></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
            <div style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #56657D"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#017F8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.d}}"></path></svg>{{s.l}}</span>
              <span style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700">{{s.v}}</span>
              <sc-if value="{{s.isBar}}" hint-placeholder-val="{{ false }}"><span style="height: 6px; border-radius: 99px; background: #EBEFF5; overflow: hidden"><span style="display: block; height: 100%; width: 87%; background: #017F8E; border-radius: 99px"></span></span></sc-if>
              <sc-if value="{{s.isDelta}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; font-weight: 600; color: #017F8E">▲ {{s.delta}}</span></sc-if>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600">Subject performance</h2><button onClick="{{seeAll}}" style="border: 0; background: transparent; color: #017F8E; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px">See all</button></div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{top}}" as="d" hint-placeholder-count="3">
            <a href="Department.dc.html" style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 16px; padding: 10px 12px; text-decoration: none; color: #062A5E; display: flex; align-items: center; gap: 12px">
              <span style="width: 38px; height: 38px; border-radius: 12px; background: {{d.bg}}; color: {{d.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{d.name}}</span><span style="font-family: 'Geist Mono', monospace; color: {{d.pctInk}}">{{d.v}}%</span></span><span style="height: 5px; border-radius: 99px; background: #EBEFF5; overflow: hidden"><span style="display: block; height: 100%; width: {{d.w}}; background: {{d.bar}}; border-radius: 99px"></span></span></span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isSubjects}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{subjects}}" as="d" hint-placeholder-count="8">
          <a href="Department.dc.html" style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 16px; padding: 10px 12px; text-decoration: none; color: #062A5E; display: flex; align-items: center; gap: 12px">
            <span style="width: 38px; height: 38px; border-radius: 12px; background: {{d.bg}}; color: {{d.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{d.name}}</span><span style="font-family: 'Geist Mono', monospace; color: {{d.pctInk}}">{{d.v}}%</span></span><span style="height: 5px; border-radius: 99px; background: #EBEFF5; overflow: hidden"><span style="display: block; height: 100%; width: {{d.w}}; background: {{d.bar}}; border-radius: 99px"></span></span></span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isMocks}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{mocks}}" as="m" hint-placeholder-count="5">
          <a href="MockResult.dc.html" style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 16px; padding: 12px 14px; text-decoration: none; color: #062A5E; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; justify-content: space-between; font-size: 12px; color: #56657D"><span>{{m.date}}</span><span style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: {{m.ink}}">{{m.p}}%</span></span>
            <span style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{m.name}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #56657D">{{m.score}}</span></span>
            <span style="display: flex; gap: 14px; font-size: 12px; color: #56657D"><span>{{m.time}}</span><span>{{m.level}}</span><span style="color: #017F8E; font-weight: 600">Detailed report ›</span></span>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 22px; height: 68px; border-radius: 24px; background: #062A5E; display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
    <a href="Home.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Departments.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>Study</a>
    <a href="Progress.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; background: #12407F; color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progress</a>
    <a href="Notes.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Notes</a>
    <a href="Profile.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'overview' }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const tab = this.state.tab;
    const tabs = [['overview', 'Overview'], ['subjects', 'Subjects'], ['mocks', 'Mock exams']].map(([id, label]) => {
      const on = id === tab;
      return { label, on: on ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'flex: 1; height: 40px; border: 0; border-radius: 11px; cursor: pointer; font-size: 14px; font-weight: ' + (on ? '600; background: #FFFFFF; color: #062A5E; box-shadow: 0 1px 2px rgba(6,42,94,0.08)' : '500; background: transparent; color: #475569') };
    });
    const data = [58, 61, 60, 64, 63, 67, 66, 70, 69, 72, 71, 74];
    const pts = data.map((v, i) => [Math.round(4 + i * (318 / (data.length - 1))), Math.round(64 - (v - 55) * 2.9)]);
    const line = pts.map((p) => p.join(',')).join(' ');
    const area = line + ' 322,70 4,70';
    const stats = [
      { l: 'Questions answered', v: '1,240', delta: '12% this month', isDelta: true, isBar: false, d: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9' },
      { l: 'Study time', v: '38h 05m', delta: '28% this month', isDelta: true, isBar: false, d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2' },
      { l: 'Average score', v: '74%', delta: '10 points', isDelta: true, isBar: false, d: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { l: 'Target score', v: '85%', delta: '', isDelta: false, isBar: true, d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01' }
    ];
    const I = {
      steth: 'M6 3v5a5 5 0 0 0 10 0V3M4 3h4M14 3h4M11 13v2a5 5 0 0 0 10 0v-1M21 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      heart: 'M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z',
      brain: 'M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3z',
      baby: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM9 12h.01M15 12h.01M9.5 15.5a3.5 3.5 0 0 0 5 0',
      blade: 'M15 3l6 6-10 10H5v-6zM12 6l6 6',
      female: 'M12 14a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 14v7M9 18h6',
      globe: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',
      kidney: 'M8 4c-3 0-5 3-5 7s2 9 6 9 4-4 4-6-2-3-2-5 2-5-3-5zM16 4c3 0 5 3 5 7s-2 9-6 9'
    };
    const S = [['Cardiology', 'heart', 82, '#FFE4E6', '#B4233C'], ['Obstetrics & Gynecology', 'female', 77, '#F3E6F4', '#7A3B8E'], ['Pediatrics', 'baby', 74, '#E4ECFB', '#2550A8'], ['Internal Medicine', 'steth', 71, '#062A5E', '#FFFFFF'], ['Surgery', 'blade', 68, '#DDF3F5', '#017F8E'], ['Public Health', 'globe', 59, '#FFF3D6', '#7A5A12'], ['Neurology', 'brain', 56, '#EDE7FB', '#5A3399'], ['Nephrology', 'kidney', 52, '#FFE8D6', '#B4441A']];
    const subjects = S.map(([name, ic, v, bg, ink]) => ({ name, v, bg, ink, icon: I[ic], w: v + '%', bar: v < 60 ? '#E07A3F' : '#017F8E', pctInk: v < 60 ? '#B4441A' : '#017F8E' }));
    const M = [['Oct 5, 2026', 'Full mock exam', 76, '152 / 200', '4h 00m', 'Medium'], ['Sep 27, 2026', 'Grand Mock #11', 71, '142 / 200', '3h 12m', 'Hard'], ['Sep 20, 2026', 'Internal Medicine test', 68, '41 / 60', '1h 10m', 'Medium'], ['Sep 13, 2026', 'Exit Exam 2024 paper', 64, '128 / 200', '3h 40m', 'Hard'], ['Sep 6, 2026', 'Pediatrics test', 72, '43 / 60', '1h 05m', 'Easy']];
    const mocks = M.map(([date, name, p, score, time, level]) => ({ date, name, p, score, time, level, ink: p >= 70 ? '#017F8E' : '#7A5A12' }));
    return { accent, tabs, line, area, lastX: pts[pts.length - 1][0], lastY: pts[pts.length - 1][1], stats,
      top: subjects.slice(0, 3), subjects, mocks,
      isOverview: tab === 'overview', isSubjects: tab === 'subjects', isMocks: tab === 'mocks',
      seeAll: () => this.setState({ tab: 'subjects' }) };
  }
}
</script>
</body>
</html>
