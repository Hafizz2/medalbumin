<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question and explanation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Noto+Sans+Ethiopic:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', 'Noto Sans Ethiopic', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="MockResult.dc.html" aria-label="End session" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 600">18 <span style="color: #56657D; font-weight: 500">/ 40</span></span><span style="font-family: 'Geist Mono', monospace; color: #56657D">21:34</span></div>
        <div style="height: 6px; border-radius: 99px; background: #E0E6EE; overflow: hidden"><div style="width: 45%; height: 100%; background: #062A5E; border-radius: 99px"></div></div>
      </div>
      <button aria-label="Text size" aria-pressed="{{bigOn}}" onClick="{{toggleBig}}" style="width: 44px; height: 44px; border-radius: 14px; background: {{bigBg}}; border: 1px solid #E0E6EE; color: {{bigInk}}; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; flex-shrink: 0">Aa</button>
      <a href="Tools.dc.html" aria-label="Lab values and calculators" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3M7 15h10"></path></svg></a>
      <button aria-label="Bookmark question" aria-pressed="{{bm}}" onClick="{{toggleBm}}" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="{{bmFill}}" stroke="#062A5E" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
    </div>

    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 99px; background: #DDF3F5; color: #017F8E">Internal Med › Cardiology</span>
      <span style="font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 99px; background: #E6EBF2; color: #475569">Exit Exam 2024</span>
      <span style="font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 99px; background: #E6EBF2; color: #475569">Moderate</span>
    </div>

    <p style="margin: 0; font-size: {{stemSize}}px; line-height: 1.45; text-wrap: pretty">A 58-year-old man has had crushing chest pain for 2 hours. His pulse is 48/min. Based on the ECG, which artery is most likely occluded?</p>

    <figure style="margin: 0; background: #FFF7F5; border: 1px solid #F1DCD6; border-radius: 16px; padding: 8px 10px 6px; display: flex; flex-direction: column; gap: 4px">
      <svg role="img" aria-label="ECG lead II showing ST elevation" width="348" height="78" viewBox="0 0 350 78">
        <defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#F3CFC6" stroke-width="0.6"></path></pattern></defs>
        <rect width="350" height="78" fill="url(#g)"></rect>
        <path d="M0 55 L10 55 Q16 48 22 55 L30 55 L33 60 L38 20 L43 66 L46 44 L60 42 Q70 30 80 50 L86 55 L120 55 Q126 48 132 55 L140 55 L143 60 L148 20 L153 66 L156 44 L170 42 Q180 30 190 50 L196 55 L230 55 Q236 48 242 55 L250 55 L253 60 L258 20 L263 66 L266 44 L280 42 Q290 30 300 50 L306 55 L350 55" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"></path>
        <text x="6" y="14" font-family="Geist Mono, monospace" font-size="10" fill="#8A3B2A">II</text>
      </svg>
      <figcaption style="font-size: 11px; color: #7A4A3E; display: flex; justify-content: space-between"><span>Lead II · 25 mm/s · 10 mm/mV</span><span>Tap to zoom</span></figcaption>
    </figure>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
        <button onClick="{{o.pick}}" style="{{o.style}}">
          <span style="{{o.badge}}">{{o.key}}</span>
          <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 500">{{o.text}}</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #475569">{{o.pct}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: #062A5E; color: #F3F6FA; border-radius: 28px 28px 0 0; padding: 10px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -12px 40px rgba(6,42,94,0.25)">
      <div style="width: 40px; height: 4px; border-radius: 99px; background: #3D63A0; align-self: center"></div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: {{verdictInk}}">{{verdict}}</span>
        <div role="group" aria-label="Explanation language" style="display: flex; background: #12407F; border-radius: 10px; padding: 3px">
          <button aria-pressed="{{enOn}}" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
          <button aria-pressed="{{amOn}}" onClick="{{setAm}}" style="{{amStyle}}">አማ</button>
        </div>
      </div>
      <p lang="{{expLang}}" style="margin: 0; font-size: 14px; line-height: 1.55; color: #C5D3EA; text-wrap: pretty">{{explanation}}</p>
      <div style="flex: 1"></div>
      <div style="display: flex; gap: 8px">
        <button aria-pressed="{{savedOn}}" onClick="{{toggleSave}}" style="height: 52px; padding: 0 12px; border-radius: 16px; background: #12407F; color: {{savedInk}}; border: 0; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="{{savedFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>{{savedText}}</button>
        <a href="Discussion.dc.html" style="height: 52px; padding: 0 12px; border-radius: 16px; background: #12407F; color: #F3F6FA; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Discuss · 24</a>
        <button onClick="{{next}}" style="flex: 1; height: 52px; border-radius: 16px; background: {{accent}}; color: #062A5E; border: 0; font-size: 15px; font-weight: 600; cursor: pointer">Next →</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 'B', sheet: true, lang: 'en', bm: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const answer = 'C';
    const picked = this.state.picked;
    const O = [['A', 'Left anterior descending', '18%'], ['B', 'Left circumflex', '21%'], ['C', 'Right coronary artery', '54%'], ['D', 'Left main coronary', '4%'], ['E', 'Obtuse marginal branch', '3%']];
    const opts = O.map(([key, text, pct]) => {
      let bg = '#FFFFFF', bd = '#E0E6EE', bBg = '#EEF2F7', bInk = '#062A5E';
      if (picked) {
        if (key === answer) { bg = '#DDF3F5'; bd = '#017F8E'; bBg = '#017F8E'; bInk = '#FFFFFF'; }
        else if (key === picked) { bg = '#FFE8D6'; bd = '#B4441A'; bBg = '#B4441A'; bInk = '#FFFFFF'; }
      }
      return { key, text, pct: picked ? pct : '',
        pick: () => { if (!this.state.picked) this.setState({ picked: key, sheet: true }); },
        style: 'min-height: 52px; width: 100%; border-radius: 16px; padding: 6px 14px 6px 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #062A5E; background: ' + bg + '; border: 1.5px solid ' + bd,
        badge: 'width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; background: ' + bBg + '; color: ' + bInk };
    });
    const right = picked === answer;
    const EXP = {
      en: 'ST elevation in II, III and aVF means an inferior MI. The inferior wall is supplied by the right coronary artery in most people, and the RCA also feeds the AV node — which explains his bradycardia. LAD occlusion shows in V1–V4; circumflex in I, aVL, V5–V6.',
      am: 'በII፣ III እና aVF ላይ ያለው የST ከፍታ የልብ የታችኛው ግድግዳ (inferior MI) ጉዳትን ያሳያል። ይህ ክፍል በአብዛኛው ሰው በቀኝ ኮሮናሪ አርተሪ (RCA) ይመገባል፤ RCA የAV nodeንም ስለሚመግብ የልብ ምት መቀነሱን (bradycardia) ያስረዳል።'
    };
    const seg = (on) => 'height: 30px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; ' + (on ? 'background: #F3F6FA; color: #062A5E' : 'background: transparent; color: #A9BBD8');
    const en = this.state.lang === 'en';
    return {
      accent, opts,
      sheet: !!picked && this.state.sheet,
      verdict: right ? 'Correct — well done' : 'Not quite · Answer is C',
      verdictInk: right ? '#14BCC4' : '#FBBF77',
      explanation: EXP[this.state.lang], expLang: en ? 'en' : 'am',
      enOn: en ? 'true' : 'false', amOn: en ? 'false' : 'true', enStyle: seg(en), amStyle: seg(!en),
      setEn: () => this.setState({ lang: 'en' }), setAm: () => this.setState({ lang: 'am' }),
      closeSheet: () => this.setState({ sheet: false }),
      next: () => this.setState({ picked: null, sheet: false }),
      bm: this.state.bm ? 'true' : 'false', bmFill: this.state.bm ? '#062A5E' : 'none',
      toggleBm: () => this.setState({ bm: !this.state.bm }),
      stemSize: this.state.big ? 18 : 16, bigOn: this.state.big ? 'true' : 'false',
      bigBg: this.state.big ? '#062A5E' : '#FFFFFF', bigInk: this.state.big ? '#14BCC4' : '#062A5E',
      toggleBig: () => this.setState({ big: !this.state.big }),
      savedOn: this.state.saved ? 'true' : 'false', savedText: this.state.saved ? 'Saved' : 'Save to notes',
      savedInk: this.state.saved ? accent : '#F3F6FA', savedFill: this.state.saved ? 'currentColor' : 'none',
      toggleSave: () => this.setState({ saved: !this.state.saved })
    };
  }
}
</script>
</body>
</html>
