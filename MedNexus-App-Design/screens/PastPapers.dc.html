<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Past exam papers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button,input{font:inherit}
input::placeholder{color:#677489}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 58px 20px 110px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #56657D">Previous year questions</span>
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.03em">Past exam papers</h1>
    </div>
    <label style="height: 50px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56657D" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search papers</span>
      <input type="search" placeholder="Search year, exam or topic" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; color: #062A5E">
    </label>
    <div role="tablist" aria-label="Exam type" style="display: flex; gap: 6px; background: #E6EBF2; padding: 4px; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; color: #56657D">{{count}}</span>
      <span style="font-size: 13px; font-weight: 600; color: #017F8E; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>4 saved offline</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{papers}}" as="p" hint-placeholder-count="5">
        <a href="Question.dc.html" style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 20px; padding: 14px 16px; text-decoration: none; color: #062A5E; display: flex; align-items: center; gap: 14px">
          <span style="width: 54px; height: 54px; border-radius: 16px; background: {{p.tile}}; color: {{p.tileInk}}; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0">
            <span style="font-family: 'Geist Mono', monospace; font-size: 15px">{{p.year}}</span>
            <span style="font-size: 10px; opacity: 0.85">{{p.ec}}</span>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600; font-size: 15px">{{p.name}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: {{p.scoreInk}}">{{p.score}}</span></span>
            <span style="font-size: 12px; color: #56657D">{{p.meta}}</span>
            <span style="height: 5px; border-radius: 99px; background: #EBEFF5; overflow: hidden"><span style="display: block; height: 100%; width: {{p.done}}; background: #017F8E; border-radius: 99px"></span></span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 22px; height: 68px; border-radius: 24px; background: #062A5E; display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
    <a href="Home.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Departments.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; background: #12407F; color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>Study</a>
    <a href="Progress.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progress</a>
    <a href="Notes.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Notes</a>
    <a href="Profile.dc.html" style="min-width: 56px; height: 52px; border-radius: 16px; color: #94A6C4; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'exit' }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const T = [{ id: 'exit', label: 'Exit exam' }, { id: 'qual', label: 'Qualification' }, { id: 'block', label: 'Block exams' }];
    const tabs = T.map((t) => {
      const on = t.id === this.state.tab;
      return { ...t, on: on ? 'true' : 'false', pick: () => this.setState({ tab: t.id }),
        style: 'flex: 1; height: 40px; border: 0; border-radius: 11px; cursor: pointer; font-size: 14px; font-weight: ' + (on ? '600; background: #FFFFFF; color: #062A5E; box-shadow: 0 1px 2px rgba(6,42,94,0.08)' : '500; background: transparent; color: #475569') };
    });
    const done = { tile: '#062A5E', tileInk: '#F3F6FA' };
    const fresh = { tile: '#DDF3F5', tileInk: '#017F8E' };
    const D = {
      exit: [
        { year: '2025', ec: '2017 EC', name: 'National Exit Exam', meta: '200 questions · All systems', score: 'Best 71%', done: '100%', ...done },
        { year: '2024', ec: '2016 EC', name: 'National Exit Exam', meta: '200 questions · All systems', score: 'Best 64%', done: '100%', ...done },
        { year: '2023', ec: '2015 EC', name: 'National Exit Exam', meta: '200 questions · 38% done', score: 'In progress', done: '38%', ...fresh },
        { year: '2022', ec: '2014 EC', name: 'Licensing Exam', meta: '180 questions · Not started', score: 'New', done: '0%', ...fresh },
        { year: '2021', ec: '2013 EC', name: 'Licensing Exam', meta: '180 questions · Not started', score: 'New', done: '0%', ...fresh }
      ],
      qual: [
        { year: '2025', ec: 'C-I', name: 'Pre-internship Qualification', meta: '150 questions · Clinical', score: 'Best 78%', done: '100%', ...done },
        { year: '2024', ec: 'C-I', name: 'Pre-internship Qualification', meta: '150 questions · 52% done', score: 'In progress', done: '52%', ...fresh },
        { year: '2023', ec: 'PC-II', name: 'Pre-clinical Comprehensive', meta: '120 questions · Basic sciences', score: 'New', done: '0%', ...fresh }
      ],
      block: [
        { year: 'CVS', ec: 'Block', name: 'Cardiovascular system', meta: '6 papers · 240 questions', score: '82%', done: '76%', ...done },
        { year: 'RES', ec: 'Block', name: 'Respiratory system', meta: '5 papers · 200 questions', score: '69%', done: '40%', ...fresh },
        { year: 'GIT', ec: 'Block', name: 'Gastrointestinal system', meta: '7 papers · 280 questions', score: '58%', done: '22%', ...fresh },
        { year: 'REN', ec: 'Block', name: 'Renal & urinary', meta: '4 papers · 160 questions', score: 'New', done: '0%', ...fresh }
      ]
    };
    const papers = D[this.state.tab].map((p) => ({ ...p, scoreInk: p.score === 'New' || p.score === 'In progress' ? '#56657D' : '#017F8E' }));
    return { accent, tabs, papers, count: papers.length + ' papers available' };
  }
}
</script>
</body>
</html>
