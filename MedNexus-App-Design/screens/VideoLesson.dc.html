<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video lesson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="background: #062A5E; padding-top: 48px">
    <div style="position: relative; height: 220px; background: #0D3672; display: flex; align-items: center; justify-content: center">
      <a href="Department.dc.html" aria-label="Back" style="position: absolute; top: 10px; left: 14px; width: 40px; height: 40px; border-radius: 12px; background: rgba(6,42,94,0.6); display: flex; align-items: center; justify-content: center; color: #F3F6FA"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <svg aria-hidden="true" width="300" height="120" viewBox="0 0 300 120" style="position: absolute; opacity: 0.35"><path d="M0 70 H70 L82 50 L94 92 L108 20 L122 100 L134 70 H300" fill="none" stroke="#14BCC4" stroke-width="2"></path></svg>
      <button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="position: relative; width: 64px; height: 64px; border-radius: 50%; background: {{accent}}; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#062A5E"><path d="M8 5v14l11-7z"></path></svg></sc-if><sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#062A5E"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if></button>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 3px">
          <sc-for list="{{chapters}}" as="c" hint-placeholder-count="5"><span style="height: 4px; border-radius: 99px; flex: {{c.flex}}; background: {{c.bar}}"></span></sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; color: #C5D3EA"><span>{{at}}</span><span>14:20</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; color: #017F8E">Internal Med › Neurology › Epilepsy</span>
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">Epilepsy: choosing the first drug</h1>
      <span style="font-size: 13px; color: #56657D">[Lecturer name] · 14 min · 3,104 views</span>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button onClick="{{cycleSpeed}}" style="height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid #D8DFEA; background: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 13px; cursor: pointer">{{speed}}×</button>
      <button style="height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid #D8DFEA; background: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Captions · EN / አማ</button>
      <button style="height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid #D8DFEA; background: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Save offline</button>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 18px; overflow: hidden">
      <sc-for list="{{chapters}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" style="{{c.row}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #56657D; width: 40px">{{c.t}}</span><span style="flex: 1; font-size: 14px; font-weight: {{c.w}}; text-align: left">{{c.name}}</span><span style="font-size: 11px; font-weight: 600; color: #017F8E">{{c.now}}</span></button>
      </sc-for>
    </div>
    <div style="padding: 10px 14px; border-radius: 14px; background: #FFFBF2; border: 1px solid #F0E3C4; display: flex; gap: 10px; align-items: baseline"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7A5A12">06:12</span><span style="font-size: 13px; color: #3B3215">My note: valproate — avoid in women who could get pregnant.</span></div>
    <a href="Question.dc.html" style="height: 54px; border-radius: 16px; background: #062A5E; color: #F3F6FA; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 600; font-size: 15px"><span>Practise linked questions</span><span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: {{accent}}">12 Q</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ch: 2, playing: false, speed: 1 }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const C = [['00:00', 'Classifying seizures', 2], ['02:10', 'Focal vs generalised', 3], ['05:05', 'First-line drugs by type', 4], ['09:30', 'Pregnancy & children', 3], ['12:40', 'Status epilepticus', 2]];
    const ch = this.state.ch;
    const chapters = C.map(([t, name, flex], i) => ({ t, name, flex, now: i === ch ? 'Playing' : '',
      bar: i < ch ? accent : i === ch ? '#F3F6FA' : '#3D63A0', w: i === ch ? '600' : '500',
      pick: () => this.setState({ ch: i, playing: true }),
      row: 'width: 100%; min-height: 46px; padding: 0 14px; border: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #062A5E; ' + (i > 0 ? 'border-top: 1px solid #EBEFF5; ' : '') + (i === ch ? 'background: #EDF7F9' : 'background: #FFFFFF') }));
    const sp = [1, 1.25, 1.5, 2];
    const p = this.state.playing;
    return { accent, chapters, at: C[ch][0], paused: !p, playing: p, playLabel: p ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !p }), speed: this.state.speed,
      cycleSpeed: () => this.setState({ speed: sp[(sp.indexOf(this.state.speed) + 1) % sp.length] }) };
  }
}
</script>
</body>
</html>
