<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search and image bank</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <label style="flex: 1; height: 48px; border-radius: 15px; background: #FFFFFF; border: 1.5px solid #062A5E; display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#062A5E" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search everything</span>
        <input type="search" value="pre-eclampsia" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; color: #062A5E">
      </label>
    </div>
    <div role="tablist" aria-label="Result type" style="display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="font-family: 'Geist Mono', monospace; font-size: 11px; opacity: 0.7">{{t.n}}</span></button>
      </sc-for>
    </div>

    <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border: 1px solid #E0E6EE; border-radius: 18px; overflow: hidden">
        <sc-for list="{{results}}" as="r" hint-placeholder-count="5">
          <a href="{{r.href}}" style="{{r.row}}">
            <span style="width: 36px; height: 36px; border-radius: 11px; background: {{r.bg}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0">{{r.code}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{r.t}}</span><span style="font-size: 12px; color: #56657D">{{r.m}}</span></span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600">Image bank</h2><span style="font-size: 12px; color: #56657D">ECGs, X-rays, slides · 1,240</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{images}}" as="im" hint-placeholder-count="3">
        <a href="Question.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #062A5E">
          <span style="aspect-ratio: 1; border-radius: 14px; background: {{im.bg}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
            <svg role="img" aria-label="{{im.t}}" width="80" height="80" viewBox="0 0 80 80"><path d="{{im.d}}" fill="none" stroke="{{im.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; line-height: 1.25">{{im.t}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'all' }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const R = [
      ['q', 'Q', 'First-line drug for seizure prophylaxis in severe pre-eclampsia?', 'Question · OB/GYN · Exit 2024', 'Question.dc.html'],
      ['n', 'NOTE', 'Pre-eclampsia & eclampsia: MgSO₄ protocol', 'Official note · 5 min read', 'NoteDetail.dc.html'],
      ['v', 'VID', 'Hypertensive disorders of pregnancy', 'Video · 18 min', 'VideoLesson.dc.html'],
      ['c', 'CARD', 'Signs of magnesium toxicity', 'Flashcard · OB/GYN deck', 'Flashcards.dc.html'],
      ['q', 'Q', 'Delivery timing in pre-eclampsia with severe features', 'Question · OB/GYN · Qualification 2025', 'Question.dc.html']
    ];
    const S = { q: ['#DDF3F5', '#017F8E'], n: ['#FFF3D6', '#7A5A12'], v: ['#E4ECFB', '#2550A8'], c: ['#E6EBF2', '#475569'] };
    const T = [['all', 'All', 28], ['q', 'Questions', 14], ['n', 'Notes', 3], ['c', 'Cards', 6], ['v', 'Videos', 2], ['img', 'Images', 3]];
    const tab = this.state.tab;
    const tabs = T.map(([id, label, n]) => {
      const on = id === tab;
      return { label, n, on: on ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'height: 36px; padding: 0 11px; border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; flex-shrink: 0; ' + (on ? 'background: #062A5E; color: #F3F6FA; border: 1px solid #062A5E' : 'background: #FFFFFF; color: #062A5E; border: 1px solid #D8DFEA') };
    });
    const results = R.filter((r) => tab === 'all' || r[0] === tab).map(([k, code, t, m, href], i) => ({ code, t, m, href, bg: S[k][0], ink: S[k][1],
      row: 'display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 60px; box-sizing: border-box; text-decoration: none; color: #062A5E; ' + (i > 0 ? 'border-top: 1px solid #EBEFF5' : '') }));
    const images = [
      { t: 'ECG · inferior STEMI', bg: '#FFF7F5', stroke: '#1A1A1A', d: 'M2 46 H18 L22 40 L26 52 L31 20 L36 58 L39 36 L50 34 Q56 26 62 42 L66 46 H78' },
      { t: 'Chest X-ray · effusion', bg: '#1F2A2C', stroke: '#C5D3EA', d: 'M40 10 V70 M22 18 Q8 40 16 66 Q28 72 36 66 M58 18 Q72 40 64 66 Q52 72 44 66 M48 52 Q58 54 66 62' },
      { t: 'Histology · granuloma', bg: '#F3E6F0', stroke: '#7A3B6E', d: 'M40 40 m-22 0 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0 M32 36 h2 M44 32 h2 M38 46 h2 M48 44 h2 M30 48 h2' }
    ];
    return { accent, tabs, results, images, showList: tab !== 'img' };
  }
}
</script>
</body>
</html>
