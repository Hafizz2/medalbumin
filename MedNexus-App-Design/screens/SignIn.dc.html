<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button,input{font:inherit}
input::placeholder{color:#677489}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="background: #062A5E; color: #F3F6FA; padding: 60px 24px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="mednexus-mark.png" alt="MedNexus logo" style="width: 34px; height: 40px; object-fit: contain"></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Outfit', sans-serif; font-size: 23px; font-weight: 700; letter-spacing: -0.01em"><span style="color: #FFFFFF">Med</span><span style="color: #14BCC4">Nexus</span></span><span style="font-size: 12px; color: #A9BBD8">Connect Knowledge. Master Medicine.</span></span>
    </div>
    <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em">{{title}}</h1>
    <p style="margin: 0; font-size: 14px; color: #A9BBD8; line-height: 1.45">{{sub}}</p>
  </div>

  <div style="flex: 1; padding: 24px 22px 30px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600">Phone number</span>
        <span style="height: 56px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #062A5E; display: flex; align-items: center; gap: 10px; padding: 0 14px">
          <span style="font-family: 'Geist Mono', monospace; font-size: 16px; padding-right: 10px; border-right: 1px solid #E0E6EE">+251</span>
          <input type="tel" value="91 234 5678" style="flex: 1; border: 0; outline: 0; background: transparent; font-family: 'Geist Mono', monospace; font-size: 17px; color: #062A5E">
        </span>
      </label>
      <button onClick="{{send}}" style="height: 56px; border-radius: 16px; background: #062A5E; color: #F3F6FA; border: 0; font-size: 16px; font-weight: 600; cursor: pointer">Send code by SMS</button>
    </sc-if>
    <sc-if value="{{isOtp}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #475569">Code sent to <span style="font-family: 'Geist Mono', monospace; color: #062A5E">+251 91 *** 5678</span> · <button onClick="{{back}}" style="border: 0; background: transparent; padding: 0; color: #017F8E; font-weight: 600; cursor: pointer">Change</button></span>
        <div role="group" aria-label="6-digit code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
            <span style="{{d.style}}">{{d.v}}</span>
          </sc-for>
        </div>
        <span style="font-size: 12px; color: #56657D">Resend code in <span style="font-family: 'Geist Mono', monospace">0:42</span></span>
      </div>
      <a href="Home.dc.html" style="height: 56px; border-radius: 16px; background: #062A5E; color: #F3F6FA; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Verify &amp; continue</a>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #56657D"><span style="flex: 1; height: 1px; background: #D8DFEA"></span>or continue with<span style="flex: 1; height: 1px; background: #D8DFEA"></span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D8DFEA; font-size: 14px; font-weight: 600; cursor: pointer">Google</button>
      <button style="height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D8DFEA; font-size: 14px; font-weight: 600; cursor: pointer">Telegram</button>
      <button style="height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D8DFEA; font-size: 14px; font-weight: 600; cursor: pointer">Apple</button>
    </div>
    <div style="flex: 1"></div>
    <a href="Home.dc.html" style="min-height: 48px; border-radius: 14px; background: #E6EBF2; color: #062A5E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Browse as guest · 20 free questions</a>
    <span style="font-size: 11px; color: #56657D; text-align: center; line-height: 1.4">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy policy</a>. One account can be used on 2 devices.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 'otp' }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const otp = this.state.step === 'otp';
    const code = ['4', '8', '2', '', '', ''];
    const digits = code.map((v, i) => ({ v, style: 'height: 56px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Geist Mono, monospace; font-size: 22px; border: 1.5px solid ' + (i === 3 ? '#062A5E' : v ? '#017F8E' : '#D8DFEA') }));
    return { accent, digits, isOtp: otp, isPhone: !otp,
      title: otp ? 'Enter the 6-digit code' : 'Sign in with your phone',
      sub: otp ? 'We sent it by SMS. It expires in 5 minutes.' : 'New here? The same step creates your account.',
      send: () => this.setState({ step: 'otp' }), back: () => this.setState({ step: 'phone' }) };
  }
}
</script>
</body>
</html>
