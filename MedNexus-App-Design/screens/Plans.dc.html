<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plans and payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 54px 20px 130px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <a href="#" style="font-size: 14px; font-weight: 600">Have a promo code?</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 32px; line-height: 1.05; letter-spacing: -0.03em">Unlock every question, every year.</h1>
      <div style="display: flex; flex-direction: column; gap: 7px">
        <sc-for list="{{perks}}" as="p" hint-placeholder-count="3">
          <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #2A3A55"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#017F8E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>{{p}}</span>
        </sc-for>
      </div>
    </div>

    <div role="radiogroup" aria-label="Plan" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{plans}}" as="p" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: center"><span style="font-weight: 600; font-size: 15px">{{p.name}}</span><span style="{{p.tag}}">{{p.badge}}</span></span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 15px">{{p.price}}</span>
          <span style="font-size: 12px; opacity: 0.75">{{p.note}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #56657D">Pay with</span>
      <div role="radiogroup" aria-label="Payment method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">
            <span style="width: 30px; height: 30px; border-radius: 9px; background: {{m.c}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{m.mono}}</span>
            <span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 14px; font-weight: 600">{{m.name}}</span><span style="font-size: 11px; color: #56657D">{{m.sub}}</span></span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #F3F6FA; border-top: 1px solid #E0E6EE; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 56px; border-radius: 16px; background: #062A5E; color: #F3F6FA; border: 0; font-size: 16px; font-weight: 600; cursor: pointer">{{cta}}</button>
    <span style="font-size: 12px; color: #56657D; text-align: center">{{fine}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { plan: 'sem', method: 'tele' }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const P = [['month', 'Monthly', 'ETB [PRICE]', 'Cancel anytime', ''], ['sem', 'Semester', 'ETB [PRICE]', '6 months', 'Popular'], ['year', 'Yearly', 'ETB [PRICE]', '12 months', 'Best value'], ['exit', 'Exit pack', 'ETB [PRICE]', 'Until exam day', '']];
    const plans = P.map(([id, name, price, note, badge]) => {
      const on = id === this.state.plan;
      return { name, price, note, badge, on: on ? 'true' : 'false', pick: () => this.setState({ plan: id }),
        tag: badge ? 'font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 99px; ' + (on ? 'background: ' + accent + '; color: #062A5E' : 'background: #DDF3F5; color: #017F8E') : 'display: none',
        style: 'text-align: left; padding: 14px; border-radius: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 100px; ' + (on ? 'background: #062A5E; color: #F3F6FA; border: 1.5px solid #062A5E' : 'background: #FFFFFF; color: #062A5E; border: 1.5px solid #E0E6EE') };
    });
    const M = [['tele', 'Telebirr', 'Instant', 'tb', '#0E6FB8'], ['cbe', 'CBE Birr', 'Instant', 'CBE', '#6B2C91'], ['chapa', 'Chapa', 'Cards & wallets', 'Ch', '#3F7F2A'], ['bank', 'Bank transfer', 'Upload receipt', 'Bk', '#475569']];
    const methods = M.map(([id, name, sub, mono, c]) => {
      const on = id === this.state.method;
      return { name, sub, mono, c, on: on ? 'true' : 'false', pick: () => this.setState({ method: id }),
        style: 'min-height: 58px; padding: 8px 12px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; background: #FFFFFF; color: #062A5E; border: 1.5px solid ' + (on ? '#062A5E' : '#E0E6EE') };
    });
    const m = M.find((x) => x[0] === this.state.method);
    const bank = this.state.method === 'bank';
    return {
      accent, plans, methods,
      perks: ['All past papers, 2015–2025', 'Unlimited mocks with full explanations', 'Offline downloads on 2 devices'],
      cta: bank ? 'Upload payment receipt' : 'Pay with ' + m[1],
      fine: bank ? 'Our team approves receipts within a few hours.' : 'Your plan activates as soon as payment is confirmed.'
    };
  }
}
</script>
</body>
</html>
