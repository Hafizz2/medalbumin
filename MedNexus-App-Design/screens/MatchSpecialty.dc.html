<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match predictor — choose specialties</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:#017F8E}a:hover{color:#01606B}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'Geist', system-ui, sans-serif; color: #062A5E; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="MatchScore.dc.html" aria-label="Back to score" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E0E6EE; display: flex; align-items: center; justify-content: center; color: #062A5E; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; color: #56657D">Step 2 of 3 · Specialties</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px"><span style="height: 4px; border-radius: 99px; background: #062A5E"></span><span style="height: 4px; border-radius: 99px; background: #062A5E"></span><span style="height: 4px; border-radius: 99px; background: #D8DFEA"></span></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05">Pick up to 2 specialties</h1>
        <span style="font-size: 13px; color: #475569">{{picked}} of 2 selected · official limit</span>
      </div>
      <a href="MatchScore.dc.html" style="flex-shrink: 0; padding: 8px 10px; border-radius: 12px; background: #062A5E; color: #F3F6FA; text-decoration: none; display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 10px; color: #A9BBD8">Your score</span><span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: {{accent}}">77.7</span></a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{specs}}" as="s" hint-placeholder-count="8">
        <button aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="{{s.card}}">
          <span style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span style="{{s.tag}}">{{s.level}}</span><span style="{{s.check}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#062A5E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span></span>
          <span style="font-size: 15px; font-weight: 600; line-height: 1.2; text-align: left">{{s.name}}</span>
          <span style="font-size: 11px; opacity: 0.75; text-align: left">Lowest matched {{s.min}} · {{s.seats}} seats</span>
          <span style="font-size: 11px; font-weight: 600; color: {{s.fitInk}}">{{s.fit}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #F3F6FA; border-top: 1px solid #E0E6EE">
    <a href="MatchPredictor.dc.html" style="height: 56px; border-radius: 16px; background: #062A5E; color: #F3F6FA; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 16px">See my chances<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14BCC4","options":["#14BCC4","#7DD3FC","#FBBF77"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: ['im', 'ped'] }; }
  renderVals() {
    const accent = this.props.accent ?? '#14BCC4';
    const my = 77.7;
    const S = [
      ['im', 'Internal Medicine', 71, 180, 'High'], ['ped', 'Pediatrics', 68, 150, 'Medium'],
      ['sur', 'General Surgery', 73, 140, 'High'], ['obg', 'OB/GYN', 70, 130, 'High'],
      ['rad', 'Radiology', 79, 40, 'Very high'], ['ane', 'Anesthesiology', 62, 60, 'Low'],
      ['psy', 'Psychiatry', 60, 45, 'Low'], ['em', 'Emergency Medicine', 64, 50, 'Medium']
    ];
    const sel = this.state.sel;
    const specs = S.map(([id, name, min, seats, level]) => {
      const on = sel.includes(id);
      const above = my >= min;
      return { name, min, seats, level, on: on ? 'true' : 'false',
        pick: () => { const next = on ? sel.filter((x) => x !== id) : [...sel, id].slice(-2); this.setState({ sel: next }); },
        fit: above ? '✓ Above last year’s lowest' : '↓ ' + (min - my).toFixed(1) + ' below last year',
        fitInk: on ? (above ? accent : '#FBBF77') : (above ? '#017F8E' : '#B4441A'),
        tag: 'font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 7px; border-radius: 99px; ' + (on ? 'background: #12407F; color: #C5D3EA' : 'background: #EEF2F7; color: #475569'),
        check: 'width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: ' + accent : 'border: 1.5px solid #C3CCDA; box-sizing: border-box'),
        card: 'min-height: 128px; padding: 12px; border-radius: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; ' + (on ? 'background: #062A5E; color: #F3F6FA; border: 1.5px solid #062A5E' : 'background: #FFFFFF; color: #062A5E; border: 1.5px solid #E0E6EE') };
    });
    return { accent, specs, picked: sel.length };
  }
}
</script>
</body>
</html>
